<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="95%">
      <stop offset="0" stop-color="#ffb3d4"/>
      <stop offset="0.35" stop-color="#ff3d8b"/>
      <stop offset="0.72" stop-color="#e0137a"/>
      <stop offset="1" stop-color="#8e0f7a"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffd6e7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff9cc4" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b95"/><stop offset="1" stop-color="#c8003c"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="r"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <ellipse cx="300" cy="300" rx="170" ry="120" fill="#ffd1e6" opacity="0.35" filter="url(#soft)"/>
    <path d="M0 0 H512 V170 C360 230 160 120 0 210 Z" fill="#ffffff" opacity="0.07"/>
    <g transform="translate(18 18)">
      <!-- T -->
      <path d="M96 128 h188 a22 22 0 0 1 0 44 h-71 v190 a23 23 0 0 1 -46 0 v-190 h-71 a22 22 0 0 1 0 -44 z"
            fill="url(#glass)" stroke="url(#edge)" stroke-width="5"/>
      <g transform="translate(30 0)"><!-- i stem -->
      <rect x="312" y="232" width="46" height="153" rx="23" fill="url(#glass)" stroke="url(#edge)" stroke-width="5"/>
      <!-- heart dot -->
      <path filter="url(#glow)" fill="url(#heart)" stroke="#fff" stroke-width="5"
        d="M335 214 C335 214 296 190 296 165 C296 150 308 140 321 140 C329 140 333 144 335 149 C337 144 341 140 349 140 C362 140 374 150 374 165 C374 190 335 214 335 214 Z"/>
      </g><path d="M108 136 h170" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
      <path d="M348 246 v40" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>
  <rect x="3" y="3" width="506" height="506" rx="114" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="5"/>
</svg>
